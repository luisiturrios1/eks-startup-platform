{{ range $namespace := list "kube-system" "cert-manager" }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: platform-default-deny, namespace: {{ $namespace }}}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: platform-dns-api, namespace: {{ $namespace }}}
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}
          podSelector: {matchLabels: {k8s-app: kube-dns}}
      ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
    # Cover both service IP and post-DNAT private API/endpoint addresses.
    - to:
        - ipBlock: {cidr: {{ $.Values.vpcCidr }}}
        - ipBlock: {cidr: {{ $.Values.serviceCidr }}}
      ports: [{protocol: TCP, port: 443}]
---
{{ end }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: platform-coredns, namespace: kube-system}
spec:
  podSelector: {matchLabels: {k8s-app: kube-dns}}
  policyTypes: [Ingress, Egress]
  ingress:
    - from: [{namespaceSelector: {}}]
      ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
  egress:
    - to: [{ipBlock: {cidr: {{ printf "%s/32" .Values.dnsResolver }}}}]
      ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: platform-controller-identity, namespace: kube-system}
spec:
  podSelector:
    matchExpressions:
      - {key: app.kubernetes.io/name, operator: In, values: [karpenter, aws-load-balancer-controller]}
  policyTypes: [Egress]
  egress:
    - to: [{ipBlock: {cidr: 169.254.170.23/32}}]
      ports: [{protocol: TCP, port: 80}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: platform-controller-webhooks, namespace: kube-system}
spec:
  podSelector:
    matchExpressions:
      - {key: app.kubernetes.io/name, operator: In, values: [aws-load-balancer-controller, metrics-server]}
  policyTypes: [Ingress]
  ingress:
    - from: [{ipBlock: {cidr: {{ .Values.vpcCidr }}}}]
      ports: [{protocol: TCP, port: 9443}, {protocol: TCP, port: 10250}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: platform-metrics-kubelets, namespace: kube-system}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: metrics-server}}
  policyTypes: [Egress]
  egress:
    - to: [{ipBlock: {cidr: {{ .Values.vpcCidr }}}}]
      ports: [{protocol: TCP, port: 10250}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: platform-cert-webhook-clients, namespace: cert-manager}
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to: [{podSelector: {matchLabels: {app.kubernetes.io/component: webhook}}}]
      ports: [{protocol: TCP, port: 10250}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: platform-cert-webhook, namespace: cert-manager}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/component: webhook}}
  policyTypes: [Ingress]
  ingress:
    - from: [{ipBlock: {cidr: {{ .Values.vpcCidr }}}}]
      ports: [{protocol: TCP, port: 10250}]
