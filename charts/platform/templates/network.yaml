apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: default-deny, namespace: amazon-cloudwatch}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: telemetry-required-egress, namespace: amazon-cloudwatch}
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}
          podSelector: {matchLabels: {k8s-app: kube-dns}}
      ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
    - to:
        - ipBlock: {cidr: {{ .Values.vpcCidr }}}
        - ipBlock: {cidr: {{ .Values.serviceCidr }}}
      ports: [{protocol: TCP, port: 443}, {protocol: TCP, port: 10250}]
    - to: [{ipBlock: {cidr: 169.254.170.23/32}}]
      ports: [{protocol: TCP, port: 80}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: telemetry-ingestion, namespace: amazon-cloudwatch}
spec:
  podSelector: {matchLabels: {app: telemetry}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: {}
          podSelector: {matchLabels: {role: runtime}}
      ports: [{protocol: TCP, port: 4318}]
