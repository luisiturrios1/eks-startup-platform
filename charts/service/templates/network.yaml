{{ if not .Values.migrationOnly }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: default-deny, namespace: {{ .Values.name }}}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: required-egress, namespace: {{ .Values.name }}}
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}
          podSelector: {matchLabels: {k8s-app: kube-dns}}
      ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
    - to: [{ipBlock: {cidr: 169.254.170.23/32}}]
      ports: [{protocol: TCP, port: 80}]
    - to: [{ipBlock: {cidr: {{ .Values.vpcCidr }}}}]
      ports: [{protocol: TCP, port: 443}, {protocol: TCP, port: 5432}, {protocol: TCP, port: 3306}, {protocol: TCP, port: 6379}]
    # S3 gateway endpoints retain regional public IPs; route tables provide private transport.
    - to: [{ipBlock: {cidr: 0.0.0.0/0, except: [{{ .Values.vpcCidr }}, {{ .Values.serviceCidr }}, 169.254.0.0/16]}}]
      ports: [{protocol: TCP, port: 443}]
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: amazon-cloudwatch}}
          podSelector: {matchLabels: {app: telemetry}}
      ports: [{protocol: TCP, port: 4318}]
    {{ if .Values.dependencies }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: declared-dependencies, namespace: {{ .Values.name }}}
spec:
  podSelector: {matchLabels: {app: {{ .Values.name }}, role: runtime}}
  policyTypes: [Egress]
  egress:
    {{ range .Values.dependencies }}
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: {{ . }}}}
          podSelector: {matchLabels: {app: {{ . }}, role: runtime}}
      ports: [{protocol: TCP, port: 8443}]
    {{ end }}
    {{ end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: allowed-ingress, namespace: {{ .Values.name }}}
spec:
  podSelector: {matchLabels: {app: {{ .Values.name }}, role: runtime}}
  policyTypes: [Ingress]
  ingress:{{ if not (or .Values.publicCidrs .Values.allowedCallers) }} []{{ end }}
    {{ if .Values.publicCidrs }}
    - from:
        {{ range .Values.publicCidrs }}
        - ipBlock: {cidr: {{ . }}}
        {{ end }}
      ports: [{protocol: TCP, port: 8443}]
    {{ end }}
    {{ range .Values.allowedCallers }}
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: {{ . }}}}
          podSelector: {matchLabels: {app: {{ . }}, role: runtime}}
      ports: [{protocol: TCP, port: 8443}]
    {{ end }}

{{ end }}
