name: Validate platform
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: {python-version: '3.12'}
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with: {terraform_version: '1.16.6', terraform_wrapper: false}
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310
        with: {version: 'v3.19.0'}
      - run: python -m venv .venv && .venv/bin/pip install -r requirements-dev.txt
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            .artifacts/*.tgz
            .artifacts/global-bundle.pem
            .artifacts/calico.yaml
          key: assets-${{ hashFiles('config/artifacts.lock.json') }}
      - run: scripts/prepare-assets.sh
      - run: scripts/validate.sh
      - name: Test native admission with an isolated local Kubernetes API
        run: |
          .venv/bin/python scripts/prepare_admission_test.py
          PLATFORM_ADMISSION_INTEGRATION=1 KUBEBUILDER_ASSETS="$PWD/.artifacts/envtest/controller-tools/envtest" .venv/bin/python -m pytest -q tests/test_admission.py
      - run: python scripts/install_tools.py
      - run: .artifacts/bin/tflint --init && .artifacts/bin/tflint --recursive
      - run: pip install checkov==3.3.29
      - run: checkov -d . --framework terraform --compact
      - run: .artifacts/bin/trivy config --ignorefile .trivyignore.yaml --exit-code 1 --severity HIGH,CRITICAL --skip-dirs charts --skip-dirs .venv --skip-dirs .terraform --skip-dirs .artifacts --skip-dirs examples/apps/target .
      - run: scripts/scan_manifests.sh
      - run: .artifacts/bin/gitleaks dir . --redact --config .gitleaks.toml
  applications:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with: {distribution: temurin, java-version: '26', cache: maven, cache-dependency-path: examples/apps/pom.xml}
      - run: examples/apps/mvnw -B -f examples/apps/pom.xml verify
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: {python-version: '3.12'}
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310
        with: {version: 'v3.19.0'}
      - run: python -m venv .venv && .venv/bin/pip install -r requirements-dev.txt
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            .artifacts/*.tgz
            .artifacts/global-bundle.pem
            .artifacts/calico.yaml
          key: assets-${{ hashFiles('config/artifacts.lock.json') }}
      - run: python scripts/install_tools.py && scripts/prepare-assets.sh
      - run: docker compose up -d --wait && .venv/bin/python scripts/local_setup.py
      - run: PLATFORM_LOCAL_INTEGRATION=1 .venv/bin/pytest -q tests/integration
      - run: scripts/local_kind.sh && .venv/bin/python scripts/local_smoke.py
      - if: always()
        run: |
          if [ -x .artifacts/bin/kind ]; then .artifacts/bin/kind delete cluster --name platform-local; fi
          docker compose down

  local-plans:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: {python-version: '3.12'}
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with: {terraform_version: '1.16.6', terraform_wrapper: false}
      - run: python -m venv .venv && .venv/bin/pip install -r requirements-dev.txt
      - run: .venv/bin/python scripts/install_tools.py --tool kind
      - run: docker compose -f local/plan.compose.yml up -d --wait
      - run: .artifacts/bin/kind create cluster --name platform-review --image kindest/node:v1.34.0@sha256:7416a61b42b1662ca6ca89f02028ac133a309a2a30ba309614e8ec94d976dc5a
      - run: .venv/bin/python scripts/local_plan.py
      - if: always()
        run: |
          if [ -x .artifacts/bin/kind ]; then .artifacts/bin/kind delete cluster --name platform-review; fi
          docker compose -f local/plan.compose.yml down
