name: platform-review
services:
  ministack:
    image: ministackorg/ministack:1.5.27@sha256:4cb4f8c5c1b8e58e9a37af1c80f243de5b5cecf2e7b0461086d0dc7781d6642c
    container_name: platform-review-ministack
    ports: ["127.0.0.1:14566:4566"]
    labels: {platform.review: plans}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:4566/_ministack/health')"]
      interval: 2s
      timeout: 3s
      retries: 30
# Plan-only APIs: no Docker socket, application containers, database sidecars or AWS credentials.
