name: Infracost
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: infracost-${{ github.ref }}
  cancel-in-progress: true
jobs:
  estimate:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with: {python-version: '3.12'}
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/install_tools.py --tool infracost
      - name: Validate Dependabot cost inputs without secrets
        if: github.actor == 'dependabot[bot]'
        run: |
          python scripts/estimate_costs.py --validate-only
          echo 'Dependabot: cost inputs validated; pricing is deferred to a trusted main/manual run because Actions secrets are unavailable.' >> "$GITHUB_STEP_SUMMARY"
      - name: Estimate all environments
        if: github.actor != 'dependabot[bot]'
        env:
          INFRACOST_API_KEY: ${{ secrets.INFRACOST_API_KEY }}
        run: |
          if [ -z "$INFRACOST_API_KEY" ]; then
            echo 'INFRACOST_API_KEY repository secret is required.' >&2
            exit 1
          fi
          python scripts/estimate_costs.py
          cat build/infracost/summary.md >> "$GITHUB_STEP_SUMMARY"
      - if: github.actor != 'dependabot[bot]'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: infracost-estimates
          path: |
            build/infracost/costs.json
            build/infracost/summary.md
          retention-days: 7
          if-no-files-found: error
