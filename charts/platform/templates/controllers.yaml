apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata: {name: platform-selfsigned}
spec: {selfSigned: {}}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata: {name: platform-ca, namespace: cert-manager}
spec:
  isCA: true
  commonName: platform-internal-ca
  secretName: platform-ca
  duration: 8760h
  renewBefore: 720h
  privateKey: {algorithm: ECDSA, size: 256}
  issuerRef: {name: platform-selfsigned, kind: ClusterIssuer}
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata: {name: platform-ca}
spec: {ca: {secretName: platform-ca}}
---
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata: {name: application}
spec:
  amiFamily: AL2023
  amiSelectorTerms: [{id: {{ .Values.amiId }}}]
  instanceProfile: {{ .Values.instanceProfile }}
  subnetSelectorTerms:
    - tags: {karpenter.sh/discovery: {{ .Values.clusterName }}}
  securityGroupSelectorTerms: [{id: {{ .Values.nodeSecurityGroup }}}]
  metadataOptions: {httpEndpoint: enabled, httpTokens: required, httpPutResponseHopLimit: 1}
  blockDeviceMappings:
    - deviceName: /dev/xvda
      ebs: {volumeSize: 30Gi, volumeType: gp3, encrypted: true, deleteOnTermination: true}
  tags:
    {{- toYaml .Values.tags | nindent 4 }}
    karpenter.sh/discovery: {{ .Values.clusterName }}
---
apiVersion: karpenter.sh/v1
kind: NodePool
metadata: {name: application}
spec:
  template:
    spec:
      nodeClassRef: {group: karpenter.k8s.aws, kind: EC2NodeClass, name: application}
      expireAfter: 720h
      requirements:
        - {key: kubernetes.io/arch, operator: In, values: [amd64]}
        - {key: karpenter.sh/capacity-type, operator: In, values: [on-demand]}
        - {key: karpenter.k8s.aws/instance-category, operator: In, values: [m, c, r]}
        - {key: karpenter.k8s.aws/instance-generation, operator: Gt, values: ["5"]}
  limits: {cpu: "32", memory: 128Gi}
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 5m
    budgets: [{nodes: "10%"}]
