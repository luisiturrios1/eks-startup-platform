apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: platform-image-registry
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods, pods/ephemeralcontainers]
  variables:
    - name: ownImagePattern
      expression: {{ printf "'^%s/[a-z0-9/_.-]+@sha256:[a-f0-9]{64}$'" (.Values.registry | replace "." "[.]") | quote }}
    - name: managedImages
      expression: {{ .Values.managedAddonImages | toJson | quote }}
    - name: addonAccount
      expression: "object.metadata.namespace == 'kube-system' && object.spec.serviceAccountName in variables.managedImages"
  validations:
    - expression: >-
        object.spec.containers.all(c,
          c.image.matches(variables.ownImagePattern) ||
          (variables.addonAccount && c.image in variables.managedImages[object.spec.serviceAccountName]))
      message: "Container images must use the environment private ECR with a sha256 digest; only inventoried AWS-managed add-on images are exempt."
    - expression: >-
        !has(object.spec.initContainers) || object.spec.initContainers.all(c,
          c.image.matches(variables.ownImagePattern) ||
          (variables.addonAccount && c.image in variables.managedImages[object.spec.serviceAccountName]))
      message: "Init and sidecar images must use the environment private ECR or the exact approved AWS-managed add-on inventory."
    - expression: >-
        !has(object.spec.ephemeralContainers) || object.spec.ephemeralContainers.all(c,
          c.image.matches(variables.ownImagePattern))
      message: "Debug images must use the environment private ECR with a sha256 digest."
    - expression: >-
        !has(object.spec.volumes) || object.spec.volumes.all(v,
          !has(v.image) || v.image.reference.matches(variables.ownImagePattern))
      message: "OCI image volumes must use the environment private ECR with a sha256 digest."
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: platform-image-registry
spec:
  policyName: platform-image-registry
  validationActions: [Deny, Audit]
