name: Validate platform
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: {python-version: '3.12'}
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with: {terraform_version: '1.16.6', terraform_wrapper: false}
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310
        with: {version: 'v3.19.0'}
      - run: python -m venv .venv && .venv/bin/pip install -r requirements-dev.txt
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            .artifacts/*.tgz
            .artifacts/global-bundle.pem
            .artifacts/calico.yaml
          key: assets-${{ hashFiles('config/artifacts.lock.json') }}
      - run: scripts/prepare-assets.sh
      - run: scripts/validate.sh
      - run: python scripts/install_tools.py
      - run: .artifacts/bin/tflint --init && .artifacts/bin/tflint --recursive
      - run: pip install checkov==3.3.29
      - run: checkov -d . --framework terraform --compact
      - run: .artifacts/bin/trivy config --ignorefile .trivyignore.yaml --exit-code 1 --severity HIGH,CRITICAL --skip-dirs charts --skip-dirs .venv --skip-dirs .terraform --skip-dirs .artifacts --skip-dirs examples/apps/target .
      - run: scripts/scan_manifests.sh
      - run: .artifacts/bin/gitleaks dir . --redact --config .gitleaks.toml
  applications:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with: {distribution: temurin, java-version: '21', cache: maven, cache-dependency-path: examples/apps/pom.xml}
      - run: examples/apps/mvnw -B -f examples/apps/pom.xml verify
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: {python-version: '3.12'}
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310
        with: {version: 'v3.19.0'}
      - run: python -m venv .venv && .venv/bin/pip install -r requirements-dev.txt
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            .artifacts/*.tgz
            .artifacts/global-bundle.pem
            .artifacts/calico.yaml
          key: assets-${{ hashFiles('config/artifacts.lock.json') }}
      - run: python scripts/install_tools.py && scripts/prepare-assets.sh
      - run: docker compose up -d --wait && .venv/bin/python scripts/local_setup.py
      - run: PLATFORM_LOCAL_INTEGRATION=1 .venv/bin/pytest -q tests/integration
      - run: scripts/local_kind.sh && .venv/bin/python scripts/local_smoke.py
      - if: always()
        run: |
          if [ -x .artifacts/bin/kind ]; then .artifacts/bin/kind delete cluster --name platform-local; fi
          docker compose down
