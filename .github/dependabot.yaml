version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
  - package-ecosystem: maven
    directory: /examples/apps
    schedule: {interval: weekly}
  - package-ecosystem: terraform
    directories: [/bootstrap, /environments/dev, /environments/staging, /environments/prod, /kubernetes/dev, /kubernetes/staging, /kubernetes/prod]
    schedule: {interval: weekly}
  - package-ecosystem: pip
    directory: /
    schedule: {interval: weekly}
  - package-ecosystem: docker
    directory: /examples/apps
    schedule: {interval: weekly}
