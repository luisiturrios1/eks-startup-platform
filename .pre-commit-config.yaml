repos:
  - repo: local
    hooks:
      - id: terraform-fmt
        name: Terraform formatting
        entry: terraform fmt -check -recursive
        language: system
        pass_filenames: false
      - id: platform-contracts
        name: Validate service contracts
        entry: .venv/bin/python scripts/compile_services.py --environment dev --check
        language: system
        pass_filenames: false
