name: Infracost
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: infracost-${{ github.ref }}
  cancel-in-progress: true
jobs:
  estimate:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/install_tools.py --tool infracost
      - name: Estimate all environments
        env:
          INFRACOST_API_KEY: ${{ secrets.INFRACOST_API_KEY }}
        run: |
          if [ -z "$INFRACOST_API_KEY" ]; then
            echo 'INFRACOST_API_KEY repository secret is required.' >&2
            exit 1
          fi
          python scripts/estimate_costs.py
          cat build/infracost/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: infracost-estimates
          path: |
            build/infracost/costs.json
            build/infracost/summary.md
          retention-days: 7
          if-no-files-found: error
